[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ctoml"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["torch>=2.5,<3", "numpy>=1.26,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "Pillow>=10"]
vision = ["torchvision>=0.20,<1", "Pillow>=10", "opencv-python>=4.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
